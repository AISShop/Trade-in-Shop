<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick-Pay — AIS Area South</title>
<script>
window.__libReady={chart:false,datalabels:false,xlsx:false};
function loadScriptFallback(urls, onload, key){
  var i=0;
  function tryNext(){
    if(i>=urls.length){ if(onload)onload(false); return; }
    var s=document.createElement('script'); s.src=urls[i++];
    s.onload=function(){ if(key)window.__libReady[key]=true; if(onload)onload(true); };
    s.onerror=function(){ tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}
loadScriptFallback([
  'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js',
  'https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js'
], function(ok){
  if(ok){
    loadScriptFallback([
      'https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js',
      'https://unpkg.com/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js'
    ], function(){ if(window.__afterLibs)window.__afterLibs(); }, 'datalabels');
  } else { if(window.__afterLibs)window.__afterLibs(); }
}, 'chart');
loadScriptFallback([
  'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
], null, 'xlsx');
</script>
<style>
  @font-face{ font-family:'DB Heavent'; src:url('DB_Heavent_Med_Cond_v3_2.ttf') format('truetype'); font-weight:400 }
  @font-face{ font-family:'DB Heavent'; src:url('DBHeavent-BlackCond.ttf') format('truetype'); font-weight:800 }
  *{font-family:'DB Heavent','Sarabun','Segoe UI',system-ui,sans-serif !important;box-sizing:border-box}
  :root{
    --green:#0A5C36; --lime:#8DC63F; --ink:#0f1722; --panel:#16202b;
    --panel2:#1d2a37; --line:#2a3a48; --muted:#8aa0b2; --txt:#e8eef3;
    --danger:#e0533d; --ok:#3dba6f;
  }
  body{margin:0;background:var(--ink);color:var(--txt);font-size:18px}
  header{background:linear-gradient(135deg,var(--green),#0d7344);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  header .logo{width:34px;height:34px;border-radius:8px;background:var(--lime);display:grid;place-items:center;font-weight:800;color:var(--green)}
  header h1{margin:0;font-size:20px;font-weight:800}
  .wrap{max-width:100%;margin:0 auto;padding:14px 18px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .btn{background:var(--lime);color:#08331e;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14px}
  .btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line)}
  .btn.active{background:var(--lime);color:#08331e}
  select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--txt);font-size:14px;font-family:inherit}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:19px}
  .stats{display:flex;gap:12px;flex-wrap:wrap}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:130px;flex:1}
  .stat .n{font-size:34px;font-weight:800;line-height:1}
  .stat .l{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:5px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:16px}
  th{background:var(--panel2);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  td.num,th.num{text-align:right}
  .muted{color:var(--muted);font-size:13px}
  .shopname{font-weight:800;font-size:15px}
  .shopcode{font-size:13px;font-weight:700;color:#8DC63F;margin-top:2px}
  .chartwrap{position:relative;height:400px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:99;font-size:14px}
  #toast.show{opacity:.95}
  #toast.err{background:var(--danger)} #toast.ok{background:var(--ok)}
  @media(max-width:640px){
    header{position:static;padding:11px 13px} header h1{font-size:15px}
    body{font-size:15px} .wrap{padding:9px} .card{padding:12px;border-radius:11px}
    .chartwrap{height:280px} .stat .n{font-size:26px}
  }
</style>
</head>
<body>
<header>
  <div class="logo">AIS</div>
  <h1>Quick-Pay — Area South</h1>
</header>

<div class="wrap">
  <div class="toolbar">
    <div style="display:flex;align-items:center;gap:4px">
      <button class="btn ghost" onclick="monthStep(-1)" style="padding:6px 10px">&lsaquo;</button>
      <select id="periodSel" onchange="periodChanged()" style="min-width:150px"></select>
      <button class="btn ghost" onclick="monthStep(1)" style="padding:6px 10px">&rsaquo;</button>
    </div>
    <button class="btn ghost" onclick="loadData(true)">&#8635; รีเฟรช</button>
    <button class="btn ghost" onclick="exportXlsx()">&#8681; Export Excel</button>
    <span id="periodInfo" class="muted"></span>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="n" id="kpiQty">&mdash;</div><div class="l">จำนวนรวม (รายการ)</div></div>
      <div class="stat"><div class="n" id="kpiRev">&mdash;</div><div class="l">ยอดเงินรวม (บาท)</div></div>
      <div class="stat"><div class="n" id="kpiShops">&mdash;</div><div class="l">สาขาที่มียอด</div></div>
      <div class="stat"><div class="n" id="kpiAvg">&mdash;</div><div class="l">เฉลี่ย/วัน</div></div>
    </div>
  </div>

  <div class="card">
    <h3>ยอด Quick-Pay รายวัน (Daily) — ทั้ง Area · เทียบเดือนก่อน <span style="font-size:12px;color:#e0533d;font-weight:600">(🔴 = ต่ำกว่าเดือนก่อน)</span></h3>
    <div class="chartwrap"><canvas id="qpChart"></canvas></div>
  </div>

  <div class="card">
    <h3 id="tblTitle">ยอด Quick-Pay รายสาขา (By Location)</h3>
    <div style="overflow-x:auto">
    <table><thead><tr><th>สาขา</th><th class="num">จำนวน (รายการ)</th><th class="num">ยอดเงิน (บาท)</th><th class="num">% ของ Area</th></tr></thead>
      <tbody id="locBody"></tbody></table>
    </div>
    <div class="muted" style="margin-top:8px" id="tblFoot"></div>
  </div>
</div>

<div id="toast"></div>

<script>
var TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var SHOPS={
  'Shop Central Surat Thani':'1204','Shop Central Hat Yai':'1205','Shop Central Phuket Floresta':'1213',
  'Shop Central Nakhon Si Thammarat':'1215','Shop Central Samui':'1216',
  'Shop Serenade Club Central Festival Hat Yai':'1245','Shop Hatyai Village':'1252',
  'Shop Central Phuket Festival':'1255','Shop Robinson Trang':'1259'
};
var QP_URL='https://script.google.com/macros/s/AKfycbxnFHnV6xFxZgl3JncF3VTf10Lmm6ewrEjADfcKRpKNIbpRzyYG0CWGIko9ZLmgNCdmDA/exec';
var USE_LIVE=true;
var DATA={}, CUR_MONTH=null, LIVE_MONTHS=null, _chart=null, _initTries=0;

function jsonp(url){
  return new Promise(function(resolve,reject){
    var cb='__qp_cb_'+Math.random().toString(36).slice(2);
    var t=setTimeout(function(){ cleanup(); reject(new Error('timeout')); },12000);
    function cleanup(){ clearTimeout(t); try{delete window[cb];}catch(e){window[cb]=undefined;} if(s&&s.parentNode)s.parentNode.removeChild(s); }
    window[cb]=function(data){ cleanup(); resolve(data); };
    var s=document.createElement('script');
    s.src=url+(url.indexOf('?')<0?'?':'&')+'cb='+cb;
    s.onerror=function(){ cleanup(); reject(new Error('network')); };
    document.head.appendChild(s);
  });
}
function normalizeMd(byShop){
  var md={byShop:{}};
  Object.keys(byShop||{}).forEach(function(shop){
    var B=byShop[shop];
    md.byShop[shop]={qty:B.qty||0,rev:B.rev||0,byUser:B.byUser||{},byDay:B.byDay||{}};
  });
  return md;
}
function loadBundle(month){
  return jsonp(QP_URL+'?action=quickpayBundle&month='+month).then(function(j){
    if(!j||!j.ok) throw new Error('bad bundle');
    if(j.cur){ DATA[j.cur.month]=normalizeMd(j.cur.byShop); }
    if(j.prev){ DATA[j.prev.month]=normalizeMd(j.prev.byShop); }
    if(j.months&&j.months.length){ LIVE_MONTHS=j.months; }
    return j;
  });
}

function prevMonthKey(ym){ var a=ym.split('-'); var y=+a[0],m=+a[1]; m--; if(m<1){m=12;y--;} return y+'-'+('0'+m).slice(-2); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function monthInfo(ym){
  var a=ym.split('-'); var y=+a[0],m=+a[1]; var dim=daysInMonth(y,m);
  var now=new Date(); var curYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var todayD=(ym===curYM)?now.getDate():dim;
  return {y:y,m:m,dim:dim,todayD:todayD,passed:todayD,left:dim-todayD};
}
function monthLabel(ym){ var a=ym.split('-'); return (TH_MON[(+a[1])-1]||a[1])+' '+a[0]; }
function aggregateArea(md){ var qty=0,rev=0,shops=0;
  Object.keys(md.byShop).forEach(function(s){ qty+=md.byShop[s].qty; rev+=md.byShop[s].rev; if(md.byShop[s].qty>0)shops++; });
  return {qty:qty,rev:rev,shops:shops};
}

function periodChanged(){ CUR_MONTH=document.getElementById('periodSel').value; ensureMonth(CUR_MONTH); }
function monthStep(delta){
  var months=availableMonths(); var i=months.indexOf(CUR_MONTH); i+=(-delta);
  if(i<0)i=0; if(i>=months.length)i=months.length-1;
  CUR_MONTH=months[i]; document.getElementById('periodSel').value=CUR_MONTH; ensureMonth(CUR_MONTH);
}
function loadData(){ if(!USE_LIVE){render();return;} toast('กำลังโหลด…','');
  loadBundle(CUR_MONTH).then(function(){ fillPeriods(); render(); toast('อัปเดตแล้ว','ok'); }).catch(function(e){ toast('โหลดไม่สำเร็จ','err'); }); }
function availableMonths(){
  if(USE_LIVE && LIVE_MONTHS && LIVE_MONTHS.length) return LIVE_MONTHS.slice();
  return Object.keys(DATA).length?Object.keys(DATA).sort().reverse():['2026-07'];
}
function ensureMonth(m){
  var pm=prevMonthKey(m);
  if(DATA[m] && DATA[pm]){ render(); return; }
  toast('กำลังโหลด '+monthLabel(m)+'…','');
  loadBundle(m).then(function(){ render(); }).catch(function(){ toast('ไม่มีข้อมูล '+monthLabel(m),'err'); render(); });
}
function fillPeriods(){
  var months=availableMonths();
  var sel=document.getElementById('periodSel');
  sel.innerHTML=months.map(function(m){return '<option value="'+m+'">'+monthLabel(m)+'</option>';}).join('');
  if(!CUR_MONTH || months.indexOf(CUR_MONTH)<0)CUR_MONTH=months[0];
  sel.value=CUR_MONTH;
}

function render(){
  var md=DATA[CUR_MONTH]; if(!md)return;
  var mi=monthInfo(CUR_MONTH); var area=aggregateArea(md);
  document.getElementById('kpiQty').textContent=area.qty.toLocaleString();
  document.getElementById('kpiRev').textContent=Math.round(area.rev).toLocaleString();
  document.getElementById('kpiShops').textContent=area.shops+' / 9';
  document.getElementById('kpiAvg').textContent=(mi.passed>0?(area.qty/mi.passed).toFixed(1):'0');
  var dr=dateRange(md,mi);
  document.getElementById('periodInfo').textContent='· '+monthLabel(CUR_MONTH)+' · '+mi.dim+' วัน · '+dr;
  drawChart(md,mi,area);
  renderByLocation(md,area);
}
function dateRange(md,mi){
  var days=[];
  Object.keys(md.byShop).forEach(function(s){ var bd=md.byShop[s].byDay||{};
    Object.keys(bd).forEach(function(dt){ var dd=+dt.slice(8,10); if(dd)days.push(dd); }); });
  if(!days.length) return 'ยังไม่มีข้อมูล';
  var mn=Math.min.apply(null,days), mx=Math.max.apply(null,days), mon=TH_MON[mi.m-1];
  return 'ข้อมูล '+mn+' '+mon+'–'+mx+' '+mon;
}

function dailyArr(md,dim){
  var dayQty={};
  if(md)Object.keys(md.byShop).forEach(function(s){ var bd=md.byShop[s].byDay||{};
    Object.keys(bd).forEach(function(dt){ var dd=+dt.slice(8,10); if(dd)dayQty[dd]=(dayQty[dd]||0)+(bd[dt].qty||0); }); });
  var arr=[]; for(var d=1;d<=dim;d++)arr.push(dayQty[d]!=null?dayQty[d]:null);
  return arr;
}
function drawChart(md,mi,area){
  var labels=[]; for(var d=1;d<=mi.dim;d++)labels.push(String(d));
  var cur=dailyArr(md,mi.dim);
  for(var i=mi.todayD;i<mi.dim;i++)cur[i]=null;
  var pmKey=prevMonthKey(CUR_MONTH);
  var prev=dailyArr(DATA[pmKey],mi.dim).slice(0,mi.dim);
  var hasPrev=prev.some(function(x){return x!=null&&x>0;});
  var maxV=Math.max.apply(null,cur.concat(prev).filter(function(x){return x!=null;}).concat([0]));
  var yMax=Math.max(10,Math.ceil((maxV+3)/5)*5);
  if(!window.Chart)return;
  Chart.defaults.font.family="'DB Heavent','Sarabun','Segoe UI',sans-serif";
  Chart.defaults.font.size=15; Chart.defaults.color='#8aa0b2';
  if(window.ChartDataLabels && !Chart._qpDL){ Chart.register(ChartDataLabels); Chart._qpDL=true; }
  var cv=document.getElementById('qpChart'); var ctx=cv.getContext('2d');
  if(_chart)_chart.destroy();
  var grad=ctx.createLinearGradient(0,0,0,380);
  grad.addColorStop(0,'rgba(141,198,63,0.28)'); grad.addColorStop(1,'rgba(141,198,63,0.02)');
  function isLower(idx){ var c=cur[idx],p=prev[idx]; return(c!=null&&p!=null&&c<p); }
  var ds=[];
  if(hasPrev){
    ds.push({label:'เดือนก่อน ('+monthLabel(pmKey)+')',data:prev,borderColor:'#7c8b99',borderWidth:2,borderDash:[6,4],
      fill:false,tension:0.4,cubicInterpolationMode:'monotone',pointRadius:0,pointHoverRadius:5,spanGaps:true,order:2,datalabels:{display:false}});
  }
  ds.push({label:'เดือนนี้ ('+monthLabel(CUR_MONTH)+')',data:cur,borderColor:'#8DC63F',borderWidth:4,backgroundColor:grad,fill:true,
    tension:0.4,cubicInterpolationMode:'monotone',
    pointBackgroundColor:function(c){return isLower(c.dataIndex)?'#e0533d':'#8DC63F';},
    pointBorderColor:'#0f1722',pointBorderWidth:1.5,
    pointRadius:function(c){return c.raw!=null?(isLower(c.dataIndex)?5:4):0;},pointHoverRadius:7,spanGaps:false,order:1,
    datalabels:{display:function(c){return c.dataset.data[c.dataIndex]!=null;},anchor:'end',align:'top',offset:6,clamp:true,clip:false,
      color:function(c){return isLower(c.dataIndex)?'#ffd0c8':'#eaffd0';},
      backgroundColor:function(c){return isLower(c.dataIndex)?'rgba(190,50,40,.90)':'rgba(10,92,54,.85)';},
      borderRadius:4,padding:{top:2,bottom:2,left:4,right:4},font:{size:13,weight:'bold'},formatter:function(v){return v==null?'':v;}}});
  _chart=new Chart(cv,{type:'line',data:{labels:labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:26,right:16}},
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:true,position:'top',labels:{usePointStyle:true,pointStyle:'line',font:{size:13},padding:14}},
        tooltip:{callbacks:{title:function(it){return 'วันที่ '+it[0].label+' '+TH_MON[mi.m-1];},
          label:function(c){var v=c.raw;if(v==null)return ' '+c.dataset.label+': —';return ' '+c.dataset.label+': '+v+' รายการ';}}}},
      scales:{x:{ticks:{maxRotation:0,autoSkip:false,font:{size:11}},grid:{display:false},title:{display:true,text:'วันที่ ('+monthLabel(CUR_MONTH)+')',font:{size:13}}},
        y:{beginAtZero:true,max:yMax,grid:{color:'#22303d'},title:{display:true,text:'จำนวนรายวัน (รายการ)',font:{size:13}}}}}});
}

function shopLabel(shop){
  var code=SHOPS[shop]||'';
  return '<div class="shopname">'+shop+'</div>'+(code?'<div class="shopcode">'+code+'</div>':'');
}
function renderByLocation(md,area){
  document.getElementById('tblTitle').textContent='ยอด Quick-Pay รายสาขา ('+monthLabel(CUR_MONTH)+')';
  var rows=Object.keys(SHOPS).map(function(s){
    var sd=md.byShop[s]; return {shop:s,qty:sd?sd.qty:0,rev:sd?sd.rev:0};
  }).sort(function(a,b){return b.qty-a.qty;});
  var html='';
  rows.forEach(function(r){
    var p=area.qty>0?(r.qty/area.qty*100):0;
    html+='<tr><td>'+shopLabel(r.shop)+'</td>'+
      '<td class="num" style="font-weight:800;color:#8DC63F;font-size:19px">'+r.qty+'</td>'+
      '<td class="num">'+Math.round(r.rev).toLocaleString()+'</td>'+
      '<td class="num">'+p.toFixed(1)+'%</td></tr>';
  });
  html+='<tr style="background:rgba(141,198,63,.08)"><td style="font-weight:800">รวม Area</td>'+
    '<td class="num" style="font-weight:800;color:#8DC63F;font-size:19px">'+area.qty+'</td>'+
    '<td class="num" style="font-weight:800">'+Math.round(area.rev).toLocaleString()+'</td><td class="num">100%</td></tr>';
  document.getElementById('locBody').innerHTML=html;
  document.getElementById('tblFoot').innerHTML='Quick-Pay = รายการที่ SALE_ORDER_OTH_NO ขึ้นต้นด้วย MC + รหัสสาขา · นับ QTY + ยอดเงิน GRAND TOTAL';
}

function exportXlsx(){
  if(typeof XLSX==='undefined'){ toast('Excel ยังไม่พร้อม','err'); return; }
  var md=DATA[CUR_MONTH]; var area=aggregateArea(md);
  var wb=XLSX.utils.book_new();
  var s1=[['Quick-Pay — '+monthLabel(CUR_MONTH)],['จำนวนรวม',area.qty,'ยอดเงินรวม',Math.round(area.rev)],[],['สาขา','Code','จำนวน (รายการ)','ยอดเงิน (บาท)']];
  Object.keys(SHOPS).forEach(function(s){ var sd=md.byShop[s]; s1.push([s.replace('Shop ',''),SHOPS[s],sd?sd.qty:0,sd?Math.round(sd.rev):0]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s1),'By Location');
  var s2=[['สาขา','พนักงาน','จำนวน','ยอดเงิน']];
  Object.keys(SHOPS).forEach(function(s){ var sd=md.byShop[s]; if(!sd)return; var us=sd.byUser||{};
    Object.keys(us).forEach(function(u){ s2.push([s.replace('Shop ',''),u,us[u].qty,Math.round(us[u].rev)]); }); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s2),'By User');
  XLSX.writeFile(wb,'QuickPay_'+CUR_MONTH+'.xlsx'); toast('Export สำเร็จ','ok');
}

function toast(msg,type){ var t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(type?' '+type:''); setTimeout(function(){t.className='';},2200); }
function showLoading(on){
  var el=document.getElementById('loadingOverlay');
  if(!el){ el=document.createElement('div'); el.id='loadingOverlay';
    el.style.cssText='position:fixed;inset:0;background:rgba(15,23,34,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#8DC63F;font-size:18px;gap:14px';
    el.innerHTML='<div style="width:44px;height:44px;border:4px solid #2a3a48;border-top-color:#8DC63F;border-radius:50%;animation:qpspin 1s linear infinite"></div><div>กำลังโหลดข้อมูล Quick-Pay…</div>';
    var st=document.createElement('style'); st.textContent='@keyframes qpspin{to{transform:rotate(360deg)}}'; document.head.appendChild(st);
    document.body.appendChild(el); }
  el.style.display=on?'flex':'none';
}

window.__afterLibs=function(){
  if(window.Chart && CUR_MONTH && DATA[CUR_MONTH] && LIVE_MONTHS){
    try{ drawChart(DATA[CUR_MONTH], monthInfo(CUR_MONTH), aggregateArea(DATA[CUR_MONTH])); }catch(e){}
  }
};
var _chartTries=0;
var _chartPoll=setInterval(function(){ _chartTries++;
  if(window.Chart && CUR_MONTH && DATA[CUR_MONTH] && LIVE_MONTHS && !_chart){
    try{ drawChart(DATA[CUR_MONTH], monthInfo(CUR_MONTH), aggregateArea(DATA[CUR_MONTH])); }catch(e){}
  }
  if(_chart || _chartTries>40) clearInterval(_chartPoll);
},500);

function init(){
  var now=new Date(); var curYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  CUR_MONTH=(curYM>='2026-07')?curYM:'2026-07';
  showLoading(true);
  tryLoad();
}
function tryLoad(){
  _initTries++;
  loadBundle(CUR_MONTH).then(function(){
    showLoading(false);
    if(!LIVE_MONTHS||!LIVE_MONTHS.length){ LIVE_MONTHS=[CUR_MONTH]; }
    if(LIVE_MONTHS.indexOf(CUR_MONTH)<0){ CUR_MONTH=LIVE_MONTHS[0]; }
    fillPeriods(); render(); toast('พร้อมแล้ว','ok');
  }).catch(function(){
    if(_initTries<3){ toast('กำลังลองใหม่… ('+_initTries+'/3)',''); setTimeout(tryLoad,1500); }
    else { showLoading(false); toast('ต่อ backend ไม่ได้','err');
      DATA[CUR_MONTH]={byShop:{}}; LIVE_MONTHS=[CUR_MONTH]; fillPeriods(); render(); }
  });
}
init();
</script>
</body>
