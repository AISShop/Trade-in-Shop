<!DOCTYPE html>
<html lang="th"><head>
<script src="gas-shim.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CVM Mobile — Offer Recommendation</title>
<style>
@font-face{font-family:'DB Heavent';src:url('DB_Heavent_Med_Cond_v3_2.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'DB Heavent';src:url('DBHeavent-BlackCond.ttf') format('truetype');font-weight:700;font-display:swap}
*{font-family:'DB Heavent','Sarabun','Segoe UI',system-ui,sans-serif !important;box-sizing:border-box}
:root{--green:#0A5C36;--lime:#8DC63F;--ink:#0f1722;--panel:#16202b;--panel2:#1d2a37;--line:#2a3a48;--muted:#8aa0b2;--txt:#e8eef3;--red:#e0533d;--blue:#4c8ff5}
body{margin:0;background:var(--ink);color:var(--txt);font-size:17px;padding:16px 20px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:14px}
select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--txt);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .n{font-size:32px;font-weight:800;margin:2px 0}
.cmp{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.cmp span{background:var(--panel2);border-radius:8px;padding:2px 8px}
.up{color:var(--lime)}.dn{color:var(--red)}.eq{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:17px;color:var(--lime)}
.sub{font-size:12px;color:var(--muted)}
.chart{position:relative;height:380px}
.shopgrid>div{margin-bottom:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-size:12px;background:var(--panel2)}th:first-child,td:first-child{text-align:left}
.msg{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:640px){body{padding:10px}.card{overflow-x:auto}}
</style></head>
<body>
<div class="bar">
  <b style="font-size:20px;color:var(--lime)">📞 CVM Mobile — Offer Recommendation</b>
  <span style="flex:1"></span>
  <select id="month" onchange="MONTH=this.value;REPORT='';load()"></select>
  <select id="rday" onchange="REPORT=this.value;render()"></select>
  <button class="btn" onclick="load()">↻ รีเฟรช</button>
</div>
<div class="sub" id="note" style="margin:-8px 0 12px">Area South 9 สาขา · Transaction = MoreInfo "Accept" · Rev = ราคา MainOffer − แพ็กเกจเดิม (นับเฉพาะที่เพิ่มขึ้น) · ข้อมูลวันที่ D มาในไฟล์วันถัดไป</div>
<div id="body"><div class="msg">กำลังโหลด…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var ADMIN_URL='https://script.google.com/macros/s/AKfycbxnFHnV6xFxZgl3JncF3VTf10Lmm6ewrEjADfcKRpKNIbpRzyYG0CWGIko9ZLmgNCdmDA/exec';
var D=null, MONTH='', REPORT='', CH={}, VIEW='loc', EXP=null, SHOPDIM='acc', SHOPCH=[];
var TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function jsonp(params){
  return new Promise(function(res,rej){
    var cb='cvm'+Date.now()+Math.floor(Math.random()*1e4), s=document.createElement('script');
    var to=setTimeout(function(){clean();rej(new Error('timeout'));},90000);
    function clean(){clearTimeout(to);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    window[cb]=function(d){clean();res(d);};
    s.src=ADMIN_URL+'?'+Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&')+'&cb='+cb+'&_='+Date.now();
    s.onerror=function(){clean();rej(new Error('network'));};
    document.body.appendChild(s);
  });
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return Math.round(n||0).toLocaleString('en-US');}
function dLabel(d){var m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?(+m[3])+' '+TH[+m[2]-1]+' '+String(+m[1]+543).slice(-2):'-';}
function mLabel(m){var x=String(m||'').match(/^(\d{4})-(\d{2})/);return x?TH[+x[2]-1]+' '+(+x[1]+543):m;}
function addDays(d,n){var t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10);}
function sameDayPrevMonth(d){var t=new Date(d+'T12:00:00'),day=t.getDate();t.setDate(1);t.setMonth(t.getMonth()-1);var last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return t.toISOString().slice(0,10);}
function pick(day){return (day.slice(0,7)===D.month?D.byDay:D.prevByDay)[day]||null;}
function cmp(cur,base,label){
  if(base==null) return '<span class="eq">'+label+' —</span>';
  var diff=cur-base, pct=base?(diff/base*100):(cur?100:0), cls=diff>0?'up':(diff<0?'dn':'eq');
  return '<span class="'+cls+'">'+label+' '+(diff>0?'+':'')+fmt(diff)+' ('+(diff>0?'+':'')+pct.toFixed(1)+'%)</span>';
}
function load(){
  document.getElementById('body').innerHTML='<div class="msg">กำลังโหลด…</div>';
  var q={action:'cvmSummary'}; if(MONTH)q.month=MONTH;
  jsonp(q).then(function(d){
    if(!d||!d.ok){document.getElementById('body').innerHTML='<div class="msg">โหลดไม่สำเร็จ: '+esc(d&&d.error)+'</div>';return;}
    D=d; MONTH=d.month;
    var ms=document.getElementById('month'); ms.innerHTML=(d.months||[]).map(function(m){return '<option value="'+m+'"'+(m===d.month?' selected':'')+'>'+mLabel(m)+'</option>';}).join('')||'<option>ไม่มีข้อมูล</option>';
    var days=Object.keys(d.byDay).sort().reverse();
    if(!REPORT||days.indexOf(REPORT)<0) REPORT=d.maxD||days[0]||'';
    document.getElementById('rday').innerHTML=days.map(function(x){return '<option value="'+x+'"'+(x===REPORT?' selected':'')+'>ข้อมูล '+dLabel(x)+'</option>';}).join('');
    render();
  }).catch(function(e){document.getElementById('body').innerHTML='<div class="msg">เชื่อมต่อไม่ได้ ('+esc(e.message)+')</div>';});
}
function render(){
  if(!D)return;
  if(!REPORT){document.getElementById('body').innerHTML='<div class="msg">ยังไม่มีข้อมูล — วางไฟล์ Offer_Recommendation ใน Google Drive โฟลเดอร์ CVMOffer แล้วรอนำเข้า (หรือ Run cvmImportFromDrive)</div>';return;}
  var cur=D.byDay[REPORT]||{acc:0,rej:0,other:0,rev:0,revCnt:0};
  var mom=pick(sameDayPrevMonth(REPORT)), d2=pick(addDays(REPORT,-2));
  var mtd=0,mtdAcc=0,pmtd=0,dd=+REPORT.slice(8,10);
  Object.keys(D.byDay).forEach(function(k){ if(k<=REPORT){mtd+=D.byDay[k].rev;mtdAcc+=D.byDay[k].acc;} });
  Object.keys(D.prevByDay).forEach(function(k){ if(+k.slice(8,10)<=dd) pmtd+=D.prevByDay[k].rev; });
  var rate=(cur.acc+cur.rej)?cur.acc/(cur.acc+cur.rej)*100:0;
  var h='<div class="kpis">'+
    kpi('Transaction Accept · '+dLabel(REPORT),fmt(cur.acc),'var(--lime)',cmp(cur.acc,mom?mom.acc:null,'MoM')+cmp(cur.acc,d2?d2.acc:null,'Day-2'))+
    kpi('Rev เพิ่ม · '+dLabel(REPORT),'฿'+fmt(cur.rev),'var(--blue)',cmp(cur.rev,mom?mom.rev:null,'MoM')+cmp(cur.rev,d2?d2.rev:null,'Day-2')+'<span class="eq">'+cur.revCnt+' รายการมี Rev</span>')+
    kpi('Rev MTD · '+mLabel(D.month)+' (ถึง '+dd+')','฿'+fmt(mtd),'var(--txt)',cmp(mtd,pmtd,'vs เดือนก่อน ช่วงเดียวกัน')+'<span class="eq">Accept MTD '+fmt(mtdAcc)+'</span>')+
    kpi('Accept vs Reject · '+dLabel(REPORT),rate.toFixed(1)+'%','var(--txt)','<span class="up">Accept '+cur.acc+'</span><span class="dn">Reject '+cur.rej+'</span><span class="eq">อื่นๆ '+cur.other+'</span>')+
    '</div>'+
    card('📈 Transaction Accept รายวัน (Daily) — ทั้ง Area · เทียบเดือนก่อน <span style="font-size:12px;color:#e0533d">(🔴 = ต่ำกว่าเดือนก่อน)</span>','ป้ายตัวเลข = ยอดวันนั้น (+/− เทียบวันก่อนหน้า) · เส้นประ = '+mLabel(D.prevMonth),'cTx')+
    card('💰 Rev เพิ่ม รายวัน (Daily) — ทั้ง Area · เทียบเดือนก่อน <span style="font-size:12px;color:#e0533d">(🔴 = ต่ำกว่าเดือนก่อน)</span>','ป้ายตัวเลข = Rev วันนั้น (+/− เทียบวันก่อนหน้า) · เส้นประ = '+mLabel(D.prevMonth),'cRev')+
    card('⚖️ Transaction Accept vs Reject รายวัน','','cAR')+
    '<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><h3 style="margin:0;flex:1">📊 รายวัน (Daily) — แยกทีละสาขา <span style="font-size:12px;color:#8aa0b2;font-weight:600">เส้นประ = เดือนก่อน · ตัวเลข (+/−) = เทียบวันก่อนหน้า · 🔴 ต่ำกว่าเดือนก่อน</span></h3>'+
    '<button class="btn" id="sdAcc" onclick="SHOPDIM=\'acc\';drawShopGrid()">Transaction</button><button class="btn" id="sdRev" onclick="SHOPDIM=\'rev\';drawShopGrid()">Rev</button></div><div id="shopGrid" class="shopgrid"></div></div>'+
    locTable();
  document.getElementById('body').innerHTML=h;
  drawCharts();
}
function kpi(l,n,col,c){return '<div class="kpi"><div class="l">'+l+'</div><div class="n" style="color:'+col+'">'+n+'</div><div class="cmp">'+c+'</div></div>';}
function card(t,s,id){return '<div class="card"><h3>'+t+'</h3><div class="sub" style="margin-bottom:6px">'+s+'</div><div class="chart"><canvas id="'+id+'"></canvas></div></div>';}
function setView(v){VIEW=v;document.getElementById('tblWrap').innerHTML=tableHtml();}
function locTable(){
  return '<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">'+
    '<h3 style="margin:0;flex:1">📍 รายละเอียด</h3>'+
    '<button class="btn" id="tbLoc" onclick="setView(\'loc\')">รายสาขา</button>'+
    '<button class="btn" id="tbUser" onclick="setView(\'user\')">ราย User</button>'+
    '<button class="btn" onclick="exportX()">⬇ Export Excel</button></div>'+
    '<div id="tblWrap">'+tableHtml()+'</div></div>';
}
function tableHtml(){
  setTimeout(function(){ ['tbLoc','tbUser'].forEach(function(id){var b=document.getElementById(id);if(b){var on=(id==='tbLoc')===(VIEW==='loc');b.style.background=on?'#0A5C36':'';b.style.color=on?'#fff':'';}}); },0);
  var dl=dLabel(REPORT), head='<th>Accept '+dl+'</th><th>Rev '+dl+'</th><th>Accept MTD</th><th>Reject MTD</th><th>%Accept</th><th>Rev MTD</th>';
  function cells(o,day){var r=(o.acc+o.rej)?o.acc/(o.acc+o.rej)*100:0;return '<td>'+day.acc+'</td><td>'+fmt(day.rev)+'</td><td>'+o.acc+'</td><td>'+o.rej+'</td><td>'+r.toFixed(1)+'%</td><td><b>'+fmt(o.rev)+'</b></td>';}
  var T={acc:0,rej:0,rev:0},TD={acc:0,rev:0}; EXP={view:VIEW,rows:[]};
  var locs=Object.keys(D.byLoc).map(function(k){return D.byLoc[k];}).sort(function(a,b){return b.rev-a.rev;});
  var body='';
  if(VIEW==='loc'){
    body=locs.map(function(L){var dd=L.days[REPORT]||{acc:0,rev:0};T.acc+=L.acc;T.rej+=L.rej;T.rev+=L.rev;TD.acc+=dd.acc;TD.rev+=dd.rev;
      EXP.rows.push([L.code,L.name,dd.acc,dd.rev,L.acc,L.rej,(L.acc+L.rej)?+(L.acc/(L.acc+L.rej)*100).toFixed(1):0,L.rev]);
      return '<tr><td><b>'+L.code+'</b> <span class="sub">'+esc(L.name)+'</span></td>'+cells(L,dd)+'</tr>';}).join('');
    head='<th>สาขา</th>'+head;
  }else{
    var users=Object.keys(D.byUser).map(function(k){return D.byUser[k];});
    locs.forEach(function(L){
      var us=users.filter(function(u){return u.loc===L.code;}).sort(function(a,b){return b.rev-a.rev||b.acc-a.acc;});
      if(!us.length)return;
      var ld=L.days[REPORT]||{acc:0,rev:0};T.acc+=L.acc;T.rej+=L.rej;T.rev+=L.rev;TD.acc+=ld.acc;TD.rev+=ld.rev;
      body+='<tr style="background:rgba(141,198,63,.10)"><td colspan="2"><b>'+L.code+' '+esc(L.name)+'</b></td>'+cells(L,ld)+'</tr>';
      us.forEach(function(u){var dd=u.days&&u.days[REPORT]||{acc:0,rev:0};
        EXP.rows.push([L.code,L.name,u.user,dd.acc,dd.rev,u.acc,u.rej,(u.acc+u.rej)?+(u.acc/(u.acc+u.rej)*100).toFixed(1):0,u.rev]);
        body+='<tr><td></td><td>'+esc(u.user)+'</td>'+cells(u,dd)+'</tr>';});
    });
    head='<th>สาขา</th><th>User</th>'+head;
  }
  var tr=(T.acc+T.rej)?T.acc/(T.acc+T.rej)*100:0;
  var foot='<tr style="font-weight:700;background:rgba(76,143,245,.12)"><td'+(VIEW==='user'?' colspan="2"':'')+'>รวม Area</td><td>'+TD.acc+'</td><td>'+fmt(TD.rev)+'</td><td>'+T.acc+'</td><td>'+T.rej+'</td><td>'+tr.toFixed(1)+'%</td><td>'+fmt(T.rev)+'</td></tr>';
  EXP.total=[TD.acc,TD.rev,T.acc,T.rej,+tr.toFixed(1),T.rev];
  return '<div style="overflow-x:auto"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+foot+'</tbody></table></div>';
}
function exportX(){
  if(typeof XLSX==='undefined'||!EXP){alert('ตัวช่วย Excel ยังโหลดไม่เสร็จ ลองอีกครั้ง');return;}
  var dl=REPORT, isU=EXP.view==='user';
  var aoa=[['CVM Offer — '+(isU?'ราย User':'รายสาขา')+' · ข้อมูล '+dl+' · MTD '+D.month],[]];
  aoa.push((isU?['สาขา','ชื่อสาขา','User']:['สาขา','ชื่อสาขา']).concat(['Accept '+dl,'Rev '+dl,'Accept MTD','Reject MTD','%Accept','Rev MTD']));
  EXP.rows.forEach(function(r){aoa.push(r);});
  aoa.push([]); aoa.push((isU?['รวม Area','','']:['รวม Area','']).concat(EXP.total));
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),isU?'ByUser':'ByLocation');
  XLSX.writeFile(wb,'CVM_'+(isU?'ByUser':'ByLocation')+'_'+dl+'.xlsx');
}
function series(src,month,key,n,upto){var a=[];for(var i=1;i<=n;i++){var k=month+'-'+('0'+i).slice(-2),o=src[k];a.push(upto&&i>upto?null:(o?o[key]:(upto?0:null)));}return a;}
// วาดตัวเลขบนกราฟเอง (ไม่พึ่งปลั๊กอินภายนอก) — ตั้ง ds.lbl = function(v,i){return 'ข้อความ'} · ds.lblBg / ds.lblColor
var VALUE_LABELS={id:'valueLabels',afterDatasetsDraw:function(chart){
  var ctx=chart.ctx; ctx.save(); ctx.textAlign='center'; ctx.textBaseline='bottom';
  chart.data.datasets.forEach(function(ds,di){
    if(!ds.lbl)return; var meta=chart.getDatasetMeta(di); if(meta.hidden)return;
    ctx.font='bold '+(ds.lblSize||10)+'px "DB Heavent",Sarabun,sans-serif';
    meta.data.forEach(function(el,i){
      var v=ds.data[i]; if(v==null||(ds.lblHideZero&&!v))return; var t=ds.lbl(v,i); if(!t)return;
      var p=el.tooltipPosition(), w=ctx.measureText(t).width+8, h=(ds.lblSize||10)+4, x=p.x, y=p.y-(ds.type==='bar'||chart.config.type==='bar'?2:6);
      var bg=typeof ds.lblBg==='function'?ds.lblBg(i):ds.lblBg; if(bg){ctx.fillStyle=bg;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x-w/2,y-h,w,h,3);else ctx.rect(x-w/2,y-h,w,h);ctx.fill();}
      ctx.fillStyle=(typeof ds.lblColor==='function'?ds.lblColor(i):ds.lblColor)||'#e8eef3'; ctx.fillText(t,x,y-1);
    });
  }); ctx.restore();
}};
// ค่า (+/− เทียบวันก่อนหน้าที่มีข้อมูล)
function dod(arr,v,i,money){ var p=null; for(var k=i-1;k>=0;k--){ if(arr[k]!=null){p=arr[k];break;} } var f=money?fmt:String;
  if(p==null)return f(v); var d=v-p; return f(v)+' ('+(d>0?'+':(d<0?'−':'±'))+f(Math.abs(d))+')'; }
var SHOP_COLORS=['#8DC63F','#4FC3F7','#FF8A65','#BA68C8','#FFD54F','#4DB6AC','#F06292','#A1887F','#90A4AE'];
function drawShopGrid(){
  var grid=document.getElementById('shopGrid'); if(!grid||typeof Chart==='undefined')return;
  ['sdAcc','sdRev'].forEach(function(id){var b=document.getElementById(id);if(b){var on=(id==='sdAcc')===(SHOPDIM==='acc');b.style.background=on?'#0A5C36':'';b.style.color=on?'#fff':'';}});
  SHOPCH.forEach(function(c){try{c.destroy();}catch(e){}}); SHOPCH=[]; grid.innerHTML='';
  var y=+D.month.slice(0,4),m=+D.month.slice(5,7),n=new Date(y,m,0).getDate(),upto=+String(D.maxD).slice(8,10)||n,isRev=SHOPDIM==='rev';
  var labels=[];for(var i=1;i<=n;i++)labels.push(String(i));
  var locs=Object.keys(D.byLoc).map(function(k){return D.byLoc[k];}).sort(function(a,b){return (isRev?b.rev-a.rev:b.acc-a.acc);});
  locs.forEach(function(L,idx){
    var col=SHOP_COLORS[idx%SHOP_COLORS.length], cur=series(L.days,D.month,SHOPDIM,n,upto), prv=series(L.prevDays||{},D.prevMonth,SHOPDIM,n,0);
    var low=function(k){return cur[k]!=null&&prv[k]!=null&&cur[k]<prv[k];};
    var row=document.createElement('div');
    row.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-weight:800;font-size:14px;color:'+col+'">'+L.code+' <span style="color:var(--muted);font-weight:600;font-size:12px">'+esc(L.name)+'</span></span>'+
      '<span style="font-weight:800;font-size:14px;color:'+col+'">Accept '+L.acc+' · Rev ฿'+fmt(L.rev)+'</span></div><div style="height:170px;position:relative"><canvas></canvas></div>';
    grid.appendChild(row);
    var cv=row.querySelector('canvas'), g=cv.getContext('2d').createLinearGradient(0,0,0,170); g.addColorStop(0,col+'55'); g.addColorStop(1,col+'08');
    SHOPCH.push(new Chart(cv,{type:'line',plugins:[VALUE_LABELS],data:{labels:labels,datasets:[
      {label:'เดือนก่อน',data:prv,borderColor:'#7c8b99',borderWidth:1.5,borderDash:[5,4],fill:false,tension:.35,cubicInterpolationMode:'monotone',pointRadius:0,spanGaps:true},
      {label:'เดือนนี้',data:cur,borderColor:col,backgroundColor:g,borderWidth:2.5,fill:true,tension:.35,cubicInterpolationMode:'monotone',spanGaps:false,
        pointBackgroundColor:function(c){return low(c.dataIndex)?'#e0533d':col;},pointRadius:function(c){return c.raw!=null?3:0;},pointHoverRadius:5,
        lbl:function(v,k){return dod(cur,v,k,isRev);}, lblSize:10, lblColor:function(k){return low(k)?'#ff9c8c':col;}}]},
      options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:16,right:8}},interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:false},tooltip:{callbacks:{title:function(it){return 'วันที่ '+it[0].label;},label:function(c){return ' '+c.dataset.label+': '+(c.raw==null?'—':fmt(c.raw)+(isRev?' บาท':' รายการ'));}}}},
        scales:{x:{ticks:{color:'#8aa0b2',maxRotation:0,autoSkip:true,maxTicksLimit:16,font:{size:9}},grid:{display:false}},
          y:{beginAtZero:true,grace:'25%',ticks:{color:'#8aa0b2',font:{size:9},maxTicksLimit:4},grid:{color:'#22303d'}}}}}));
  });
}
function drawCharts(){
  if(typeof Chart==='undefined')return;
  Object.keys(CH).forEach(function(k){CH[k].destroy();}); CH={};
  var y=+D.month.slice(0,4),m=+D.month.slice(5,7),n=new Date(y,m,0).getDate(),upto=+String(D.maxD).slice(8,10)||n;
  var labels=[];for(var i=1;i<=n;i++)labels.push(String(i));
  var accCur=series(D.byDay,D.month,'acc',n,upto),accPrev=series(D.prevByDay,D.prevMonth,'acc',n,0);
  var revCur=series(D.byDay,D.month,'rev',n,upto),revPrev=series(D.prevByDay,D.prevMonth,'rev',n,0);
  var rejCur=series(D.byDay,D.month,'rej',n,upto);
  var axis={x:{ticks:{color:'#8aa0b2',maxRotation:0,autoSkip:false,font:{size:10}},grid:{display:false}},y:{beginAtZero:true,grace:'18%',ticks:{color:'#8aa0b2'},grid:{color:'#22303d'}}};
  var legend={labels:{color:'#8aa0b2',usePointStyle:true,font:{size:12}}};
  function line(id,cur,prev,col,isRev){
    var low=function(i){return cur[i]!=null&&prev[i]!=null&&cur[i]<prev[i];};
    var cv=document.getElementById(id), g=cv.getContext('2d').createLinearGradient(0,0,0,380);
    g.addColorStop(0,col+'47'); g.addColorStop(1,col+'05');
    var maxV=Math.max.apply(null,cur.concat(prev).filter(function(x){return x!=null;}).concat([1]));
    CH[id]=new Chart(cv,{type:'line',plugins:[VALUE_LABELS],data:{labels:labels,datasets:[
      {label:'เดือนก่อน ('+mLabel(D.prevMonth)+')',data:prev,borderColor:'#7c8b99',borderDash:[6,4],borderWidth:2,pointRadius:0,pointHoverRadius:5,tension:.4,cubicInterpolationMode:'monotone',spanGaps:true,order:2},
      {label:'เดือนนี้ ('+mLabel(D.month)+')',data:cur,borderColor:col,borderWidth:4,tension:.4,cubicInterpolationMode:'monotone',fill:true,backgroundColor:g,order:1,
        pointBackgroundColor:function(c){return low(c.dataIndex)?'#e0533d':col;},pointBorderColor:'#0f1722',pointBorderWidth:1.5,
        pointRadius:function(c){return c.raw!=null?(low(c.dataIndex)?5:4):0;},pointHoverRadius:7,
        lbl:function(v,i){return dod(cur,v,i,isRev);}, lblSize:12,
        lblBg:function(i){return low(i)?'rgba(190,50,40,.90)':'rgba(10,92,54,.85)';}, lblColor:function(i){return low(i)?'#ffd0c8':'#eaffd0';}}
    ]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:26,right:16}},interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:true,position:'top',labels:{color:'#8aa0b2',usePointStyle:true,pointStyle:'line',font:{size:13},padding:14}},
        tooltip:{callbacks:{title:function(it){return 'วันที่ '+it[0].label+' '+TH[m-1];},label:function(c){return ' '+c.dataset.label+': '+(c.raw==null?'—':fmt(c.raw)+(isRev?' บาท':' รายการ'));}}}},
      scales:{x:{ticks:{color:'#8aa0b2',maxRotation:0,autoSkip:false,font:{size:11}},grid:{display:false},title:{display:true,text:'วันที่ ('+mLabel(D.month)+')',color:'#8aa0b2',font:{size:13}}},
        y:{beginAtZero:true,suggestedMax:maxV*1.25,ticks:{color:'#8aa0b2'},grid:{color:'#22303d'},title:{display:true,text:isRev?'Rev เพิ่ม (บาท)':'Transaction Accept (รายการ)',color:'#8aa0b2',font:{size:13}}}}}});
  }
  line('cTx',accCur,accPrev,'#8DC63F',false);
  line('cRev',revCur,revPrev,'#4c8ff5',true);
  drawShopGrid();
  CH.cAR=new Chart(document.getElementById('cAR'),{type:'bar',plugins:[VALUE_LABELS],data:{labels:labels,datasets:[
    {label:'Accept',data:accCur,backgroundColor:'#8DC63F',lbl:function(v){return String(v);},lblHideZero:true,lblColor:'#8DC63F'},
    {label:'Reject',data:rejCur,backgroundColor:'#e0533d',lbl:function(v){return String(v);},lblHideZero:true,lblColor:'#ff9c8c'}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:legend},scales:axis}});
}
load();
</script>
